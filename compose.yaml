name: gym4me

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym4me
      POSTGRES_USER: gym4me
      POSTGRES_PASSWORD: gym4me_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym4me -d gym4me"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres-test:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: gym4me_test
      POSTGRES_USER: gym4me
      POSTGRES_PASSWORD: gym4me_local
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym4me -d gym4me_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
