name: Android demo APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-demo
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://gym4me-demo-api.vercel.app/api/v1
      NEXT_PUBLIC_SITE_URL: https://gym4me-demo-application.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.8.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Verify workspace dependencies and protected design
        run: |
          node scripts/check-workspace-dependencies.mjs
          node scripts/check-protected-design.mjs
      - name: Export bundled demo application
        run: pnpm --filter application build:native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: pnpm --filter application exec cap sync android
      - name: Build installable debug APK and run native tests
        working-directory: apps/application/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: gym4me-demo-android
          path: apps/application/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
