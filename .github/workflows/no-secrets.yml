name: no-secrets

# Fails a PR that adds a file which usually holds secrets (.env, seed/users.json, keys).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Block secret files
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$|(^|/)seed/users\.json$|\.(pem|pfx|p12|key)$|(^|/)appsettings\.[^/]*\.local\.json$' \
            | grep -vE '\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::These files may contain secrets and must not be committed:"
            echo "$found"
            echo "Remove them with: git rm --cached <file>   (and keep them in .gitignore)"
            exit 1
          fi
          echo "No secret files found."
