name: PH0–PH5 technical verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ph1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.8.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Verify direct workspace dependencies
        run: |
          node --test scripts/check-workspace-dependencies.test.mjs
          node scripts/check-workspace-dependencies.mjs
      - name: Preserve approved cards and club details
        run: node scripts/check-protected-design.mjs
      - name: Lint and types
        run: pnpm exec turbo run lint check-types
      - name: Install encrypted backup tool
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Verify backup, scheduling, alerts and domain associations
        run: node --test --test-concurrency=1 scripts/backup-media.test.mjs scripts/backup-verify.test.mjs scripts/backup-retention.test.mjs scripts/recovery-media.test.mjs scripts/operations-worker.test.mjs scripts/operations-lifecycle.test.mjs scripts/operations-services.test.mjs scripts/monitor-alerts.test.mjs scripts/app-associations.test.mjs
      - name: Verify local TLS proxy
        run: |
          node scripts/staging-tls.mjs
          node --test scripts/staging-proxy.test.mjs scripts/staging-monitor.test.mjs
      - name: Start isolated test dependencies
        run: docker compose --profile test up -d --wait postgres-test storage
      - name: Unit and integration acceptance
        run: bash scripts/verify-ph1.sh
      - name: Verify clean and reset demo provisioning
        run: node --test scripts/demo-provisioning.test.mjs
      - name: Verify commerce capacity, money, queues and repeated commands
        run: pnpm --filter api exec jest --config test/jest.commerce.json --runInBand
      - name: Verify coaching permissions, calendar, sessions and contracts
        run: |
          docker compose exec -T postgres-test psql -U gym4me -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gym4me_coaching_test'
          pnpm --filter api exec jest --config test/jest.coaching.json --runInBand
      - name: Verify training, offline command races and private collaboration
        run: |
          docker compose exec -T postgres-test psql -U gym4me -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gym4me_training_test'
          pnpm --filter api test:training
      - name: Verify advanced settlements, plan gates and shared-branch balance races
        run: |
          docker compose exec -T postgres-test psql -U gym4me -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gym4me_ph5_test'
          pnpm --filter api test:ph5
      - name: Verify CRM, offers, network credit, split games, food sources and native push
        env:
          COMPLETION_TEST_DATABASE_URL: postgresql://gym4me:gym4me_local@127.0.0.1:55433/gym4me_completion_test
        run: |
          docker compose exec -T postgres-test psql -U gym4me -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gym4me_completion_test'
          pnpm --filter api test:completion
      - name: Verify notification privacy, scheduling and obsolete work
        env:
          TEST_DATABASE_URL: postgresql://gym4me:gym4me_local@127.0.0.1:55433/gym4me_notification_guard_test
        run: |
          docker compose exec -T postgres-test psql -U gym4me -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gym4me_notification_guard_test'
          pnpm --filter api test:notifications
      - name: Restore isolated database and files
        run: pnpm --filter api backup:drill
      - name: Build web applications and API
        run: |
          pnpm --filter api build
          pnpm --filter application exec next build --webpack
          pnpm --filter business exec next build --webpack
          pnpm --filter admin exec next build --webpack
      - name: Build bundled mobile shell
        env:
          NEXT_PUBLIC_API_URL: https://gym4me-demo-api.vercel.app/api/v1
          NEXT_PUBLIC_SITE_URL: https://gym4me-demo-application.vercel.app
        run: pnpm --filter application build:native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults include the retired "tools" package; command-line tools are installed separately.
          packages: platform-tools
      - name: Synchronize Android native dependencies
        run: pnpm --filter application exec cap sync android
      - name: Build Android and run native unit tests
        working-directory: apps/application/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/application/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Stop disposable services
        if: always()
        run: docker compose --profile test down --volumes

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://gym4me-demo-application.vercel.app
      NEXT_PUBLIC_API_URL: https://gym4me-demo-api.vercel.app/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.8.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Verify direct workspace dependencies
        run: |
          node --test scripts/check-workspace-dependencies.test.mjs
          node scripts/check-workspace-dependencies.mjs
      - name: Export and synchronize iOS shell
        run: |
          pnpm --filter application build:native
          pnpm --filter application exec cap sync ios
      - name: Build iOS simulator without signing
        run: xcodebuild -project apps/application/ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .artifacts/ios-ci CODE_SIGNING_ALLOWED=NO build
