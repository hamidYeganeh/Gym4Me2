name: PH1 verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ph1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.8.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Lint and types
        run: pnpm exec turbo run lint check-types
      - name: Install encrypted backup tool
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Verify backup, scheduling, alerts and domain associations
        run: node --test scripts/backup-verify.test.mjs scripts/operations-worker.test.mjs scripts/monitor-alerts.test.mjs scripts/app-associations.test.mjs
      - name: Verify local TLS proxy
        run: |
          node scripts/staging-tls.mjs
          node --test scripts/staging-proxy.test.mjs scripts/staging-monitor.test.mjs
      - name: Start isolated test dependencies
        run: docker compose --profile test up -d --wait postgres-test storage
      - name: Unit and integration acceptance
        run: bash scripts/verify-ph1.sh
      - name: Restore isolated database and files
        run: pnpm --filter api backup:drill
      - name: Build web applications and API
        run: |
          pnpm --filter api build
          pnpm --filter application exec next build --webpack
          pnpm --filter business exec next build --webpack
          pnpm --filter admin exec next build --webpack
      - name: Build bundled mobile shell
        run: pnpm --filter application build:native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build Android and run native unit tests
        working-directory: apps/application/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/application/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Stop disposable services
        if: always()
        run: docker compose --profile test down --volumes

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://gym4me.ir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.8.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - name: Export and synchronize iOS shell
        run: |
          pnpm --filter application build:native
          pnpm --filter application exec cap sync ios
      - name: Build iOS simulator without signing
        run: xcodebuild -project apps/application/ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .artifacts/ios-ci CODE_SIGNING_ALLOWED=NO build
