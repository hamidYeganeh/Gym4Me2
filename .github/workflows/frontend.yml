name: frontend

on:
  pull_request:
  push:
    branches: [main, codex/gym4me-baseline]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gym4me_test
          POSTGRES_USER: gym4me
          POSTGRES_PASSWORD: gym4me_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U gym4me -d gym4me_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # no "cache: npm" here: it runs npm 11 inside the repo
      - name: Install npm from package.json volta.npm
        run: |
          npm_version=$(node -e '
            const { volta } = require("./package.json");
            const nvmrc = require("fs").readFileSync(".nvmrc", "utf8").trim();
            if (volta.node !== nvmrc) {
              console.error(`::error::.nvmrc (${nvmrc}) and package.json volta.node (${volta.node}) differ.`);
              process.exit(1);
            }
            console.log(volta.npm);
          ')
          # Outside the repo, because devEngines refuses the bundled npm 11 inside it.
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Apply PostgreSQL migrations
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat apps/backend/migrations/*.sql |
            docker exec -i "$POSTGRES_CONTAINER" psql -U gym4me -d gym4me_test -v ON_ERROR_STOP=1 -1 -f -
      - name: Test backend against PostgreSQL
        env:
          DATABASE_URL: postgresql://gym4me:gym4me_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/gym4me_test
        run: npm run test:e2e --workspace backend
      - run: npm run build
      - run: npm run build:native --workspace application
      - run: test -f apps/application/out/index.html
