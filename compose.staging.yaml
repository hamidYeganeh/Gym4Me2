name: gym4me-staging
services:
  postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gym4me_stage
      POSTGRES_USER: gym4me_stage_admin
      POSTGRES_PASSWORD: ${STAGE_ADMIN_PASSWORD:?set staging admin password}
      STAGE_MIGRATION_PASSWORD: ${STAGE_MIGRATION_PASSWORD:?set migration password}
      STAGE_RUNTIME_PASSWORD: ${STAGE_RUNTIME_PASSWORD:?set runtime password}
    ports: ["127.0.0.1:55434:5432"]
    volumes:
      - stage_postgres:/var/lib/postgresql
      - ./ops/staging/init-db.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym4me_stage_admin -d gym4me_stage"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    restart: unless-stopped
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set staging storage identity}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set staging storage secret}
      S3_BUCKET: gym4me-stage
    ports: ["127.0.0.1:8334:8333"]
    volumes: ["stage_storage:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  stage_postgres:
  stage_storage:
