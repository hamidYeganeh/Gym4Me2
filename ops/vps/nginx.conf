# Install as /etc/nginx/sites-available/gym4me, then enable the symlink.
# Certbot adds HTTPS after all DNS names resolve to this VPS.
map $http_upgrade $gym4me_connection {
    default upgrade;
    '' close;
}

map $host $gym4me_upstream {
    default 127.0.0.1:7084;
    gym4me.ir 127.0.0.1:7084;
    www.gym4me.ir 127.0.0.1:7084;
    app.gym4me.ir 127.0.0.1:7081;
    admin.gym4me.ir 127.0.0.1:7082;
    business.gym4me.ir 127.0.0.1:7083;
    api.gym4me.ir 127.0.0.1:7088;
}

server {
    listen 80;
    server_name gym4me.ir www.gym4me.ir app.gym4me.ir admin.gym4me.ir business.gym4me.ir api.gym4me.ir;
    client_max_body_size 20m;

    location / {
        proxy_pass http://$gym4me_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gym4me_connection;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
