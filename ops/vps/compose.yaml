name: gym4me-production

services:
  postgres:
    image: postgres@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym4me
      POSTGRES_USER: gym4me_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?required}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym4me_admin -d gym4me"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  storage:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      S3_BUCKET: gym4me
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  storage_data:
